[project]
name = "stockval"
version = "0.1.0"
description = "Stock valuation screener using DCF, PEG, EV/EBITDA, Graham Number, and P/B-vs-ROE."
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
stockval = "stockval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
